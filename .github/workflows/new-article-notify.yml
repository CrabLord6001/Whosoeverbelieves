name: New article notification

# When an article appears in search-index.js on main, email Jonathan a
# ready-to-send link for /announce.
#
# This never emails a subscriber. The broadcast still goes out only when he
# opens that page and clicks Send to All Subscribers, so a corrective push
# cannot blast the list, and the subject line stays his to edit.
#
# Secrets required: RESEND_API_KEY, ANNOUNCE_NOTIFY_EMAIL

on:
  push:
    branches: [main]
    paths: ['search-index.js']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: new-article-notify
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Work out which articles are new
        id: detect
        run: |
          set -euo pipefail

          before="${{ github.event.before }}"
          if [ -z "$before" ] \
            || [ "$before" = "0000000000000000000000000000000000000000" ] \
            || ! git cat-file -e "${before}^{commit}" 2>/dev/null; then
            before="$(git rev-parse HEAD^ 2>/dev/null || true)"
          fi

          : > old-search-index.js
          if [ -n "$before" ]; then
            git show "${before}:search-index.js" > old-search-index.js 2>/dev/null \
              || : > old-search-index.js
          fi

          # Safety valve. An unreadable previous index makes every article look
          # new, which would send one notice per article. Say nothing instead.
          if [ ! -s old-search-index.js ]; then
            echo "::warning::Could not read search-index.js at ${before:-unknown commit} - skipping this run."
            echo "count=0" >> "$GITHUB_OUTPUT"
            printf 'added<<ADDED_JSON\n[]\nADDED_JSON\n' >> "$GITHUB_OUTPUT"
            rm -f old-search-index.js
            exit 0
          fi

          added="$(node .github/scripts/detect-new-articles.mjs old-search-index.js search-index.js)"
          count="$(node -e 'process.stdout.write(String(JSON.parse(process.argv[1]).length))' "$added")"
          rm -f old-search-index.js

          echo "count=${count}" >> "$GITHUB_OUTPUT"
          {
            echo 'added<<ADDED_JSON'
            echo "$added"
            echo 'ADDED_JSON'
          } >> "$GITHUB_OUTPUT"

          echo "New articles found: ${count}"
          echo "$added"

      - name: Email the ready-to-send link
        if: steps.detect.outputs.count != '0'
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          NOTIFY_EMAIL: ${{ secrets.ANNOUNCE_NOTIFY_EMAIL }}
          ADDED: ${{ steps.detect.outputs.added }}
        run: node .github/scripts/notify-new-articles.mjs
