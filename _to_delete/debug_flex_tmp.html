<!doctype html><html><head><style>
body{background:#111;color:#eee;font-family:serif}
.audio-track-info { flex: 1; min-width: 0; width:400px; border:1px solid red;}
.audio-track-line {
  display: flex; align-items: baseline; flex-wrap: wrap;
  column-gap: 0.45rem; row-gap: 0.1rem; min-width: 0;
}
#audio-track-label {
  font-family: 'EB Garamond', serif; font-size: 1rem; color: #fff;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  max-width: 100%; flex-shrink: 0;
}
.audio-edition-note {
  font-family: serif; font-style: italic;
  font-size: 0.72rem; line-height: 1.4; color: #aaa;
  white-space: normal; min-width: 0; flex: 1 1 auto;
}
</style></head><body>
<div class="audio-track-info">
  <div class="audio-track-line">
    <span id="audio-track-label">Numbers 1</span>
    <span class="audio-edition-note">— World English Bible, public domain (the narration predates the 2020 text shown here; some wording differs)</span>
  </div>
</div>
</body></html>
