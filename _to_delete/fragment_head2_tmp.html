<!doctype html><html><head><meta name="viewport" content="width=device-width, initial-scale=1">
<style>
:root { --bg:#0c0f14; --surface:#161b22; --rule:#2a2f38; --text:#e8e6e0; --text-mid:#b9b4a6; --text-faint:#8a847a; --gold:#c9a84c; }
body { margin:0; font-family: Georgia, serif; background:#20242b; }
button { font: inherit; }
.reader-head {
  flex-shrink: 0;
  display: flex; align-items: flex-start; justify-content: space-between;
  gap: 1rem; flex-wrap: wrap;
  padding: 0.9rem 1.25rem 0.75rem;
  border-bottom: 1px solid var(--rule);
  background: var(--surface);
}
.reader-title { min-width: 0; }
.reader-day { display:block; font-family:'Cinzel',serif; font-size:0.62rem; letter-spacing:0.14em; text-transform:uppercase; color:var(--gold); }
.reader-ref { display:block; margin-top:0.15rem; font-family:'Cormorant Garamond',serif; font-size:1.15rem; color:var(--text); }
.reader-tools { display:flex; align-items:center; gap:0.75rem; flex-wrap:wrap; }
.sp-trans { display:flex; gap:0.3rem; }
.sp-trans button { font-family:'Cinzel',serif; font-size:0.6rem; letter-spacing:0.08em; padding:0.26rem 0.6rem; border:1px solid var(--rule); border-radius:2px; background:none; color:var(--text-faint); }
.sp-trans button.active { background: rgba(201,168,76,0.12); border-color: var(--gold); color: var(--gold); }
.reader-close { font-family:'Cinzel',serif; font-size:0.6rem; letter-spacing:0.1em; background:none; border:1px solid var(--rule); border-radius:2px; color:var(--text-faint); padding:0.26rem 0.6rem; }
.reader-actions {
  display: flex; align-items: center; gap: 0.5rem; flex-wrap: wrap;
}
.reader-actions .day-check-label { font-size: 0.82rem; color: var(--text); }
.read-btn, .listen-btn {
  display:inline-block; font-size:0.62rem; font-family:'Cinzel',serif; letter-spacing:0.08em;
  padding:0.28rem 0.65rem; border:1px solid var(--rule); border-radius:2px;
  background:none; color: var(--text-faint);
}
@media (max-width: 600px) {
  .reader-actions .read-btn, .reader-actions .listen-btn { font-size: 0.58rem; padding: 0.24rem 0.5rem; }
  .reader-actions .day-check-label { font-size: 0.78rem; }
  .reader-head { padding: 0.7rem 0.9rem 0.6rem; gap: 0.6rem; }
  .reader-ref { font-size: 1.02rem; }
}
</style></head><body>
<div class="reader-head">
    <div class="reader-title">
      <span class="reader-day">DAY 16 &middot; TUE, OCT 13</span>
      <span class="reader-ref">Numbers 22</span>
    </div>
    <div class="reader-actions">
      <input type="checkbox" checked> <label class="day-check-label">Completed</label>
      <button class="read-btn">&#10022; Notes</button>
      <button class="listen-btn">&#128266; Listen</button>
    </div>
    <div class="reader-tools">
      <div class="sp-trans">
        <button class="active">WEB</button><button>KJV</button>
      </div>
      <button class="reader-close">ESC &#10005;</button>
    </div>
  </div>
</body></html>
