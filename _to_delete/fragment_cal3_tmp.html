<!doctype html><html><head><meta name="viewport" content="width=device-width, initial-scale=1">
<style>
:root { --bg:#0c0f14; --surface:#161b22; --rule:#2a2f38; --text:#e8e6e0; --text-mid:#b9b4a6; --text-faint:#8a847a; --gold:#c9a84c; }
body { margin:0; padding:0.75rem; font-family: Georgia, serif; background:#20242b; }
.cal-grid-7 {
    display: grid; grid-template-columns: repeat(7, 1fr); gap: 3px;
  }
/* ── CALENDAR CELL ── */
  .cal-cell {
    min-height: 72px; padding: 0.4rem 0.45rem;
    border: 1px solid var(--rule); border-radius: 4px;
    background: var(--surface); cursor: pointer;
    transition: border-color 0.15s, background 0.15s;
    display: flex; flex-direction: column; gap: 2px;
    position: relative; overflow: hidden;
    min-width: 0;
  }
  .cal-cell:hover { border-color: rgba(201,168,76,0.55); background: rgba(201,168,76,0.05); }
  .cal-cell.grace {
    background: rgba(184,64,64,0.07); border-color: rgba(184,64,64,0.25);
  }
  .cal-cell.grace:hover { border-color: rgba(184,64,64,0.45); }
  .cal-cell.completed {
    border-color: rgba(58,125,68,0.45);
    background: rgba(20,55,28,0.25);
  }
  :root.light-mode .cal-cell.completed { background: rgba(200,235,205,0.3); }
  .cal-cell.empty, .cal-cell.out-of-range {
    background: transparent; border-color: transparent; cursor: default; opacity: 0.35;
  }
  .cal-cell.empty:hover, .cal-cell.out-of-range:hover { background: transparent; border-color: transparent; }
  .cal-cell-num {
    font-family: 'Cinzel', serif; font-size: 0.62rem; color: var(--gold); letter-spacing: 0.06em;
    line-height: 1;
  }
  .cal-cell.grace .cal-cell-num { color: #b84040; }
  .cal-cell-passage {
    font-family: 'EB Garamond', serif; font-size: 0.75rem; color: var(--text);
    line-height: 1.3; overflow: hidden;
    display: -webkit-box; -webkit-line-clamp: 2; line-clamp: 2; -webkit-box-orient: vertical;
    word-break: keep-all; overflow-wrap: normal;
  }
  .cal-cell-verses {
    font-family: 'Cinzel', serif; font-size: 0.68rem; font-weight: 600;
    letter-spacing: 0.01em;
    color: var(--gold); font-style: normal; margin-top: auto;
    white-space: nowrap;
  }
  @media (max-width: 600px) {
    .cal-cell { padding: 0.3rem 0.3rem; }
    .cal-cell-passage { font-size: 0.6rem; line-height: 1.2; }
    .cal-cell-verses { font-size: 0.56rem; }
    .cal-cell-num { font-size: 0.56rem; }
  }
</style></head><body>
<div class="cal-grid-7">
<div class="cal-cell">
      <span class="cal-cell-num">28 &#10003;</span>
      <span class="cal-cell-passage">Numbers 1</span>
      <span class="cal-cell-verses">~8 min</span>
    </div><div class="cal-cell">
      <span class="cal-cell-num">29 &#10003;</span>
      <span class="cal-cell-passage">Numbers 2-3</span>
      <span class="cal-cell-verses">~13 min</span>
    </div><div class="cal-cell">
      <span class="cal-cell-num">30 &#10003;</span>
      <span class="cal-cell-passage">Numbers 4</span>
      <span class="cal-cell-verses">~8 min</span>
    </div><div class="cal-cell">
      <span class="cal-cell-num">1 &#10003;</span>
      <span class="cal-cell-passage">Numbers 5-6</span>
      <span class="cal-cell-verses">~10 min</span>
    </div><div class="cal-cell">
      <span class="cal-cell-num">2 &#10003;</span>
      <span class="cal-cell-passage">Numbers 7</span>
      <span class="cal-cell-verses">~12 min</span>
    </div><div class="cal-cell">
      <span class="cal-cell-num">3 &#10003;</span>
      <span class="cal-cell-passage">Numbers 8-9</span>
      <span class="cal-cell-verses">~8 min</span>
    </div><div class="cal-cell">
      <span class="cal-cell-num">13 &#10003;</span>
      <span class="cal-cell-passage">Numbers 22</span>
      <span class="cal-cell-verses">~7 min</span>
    </div>
</div>
</body></html>
