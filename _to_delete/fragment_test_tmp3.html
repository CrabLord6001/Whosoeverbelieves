<!doctype html><html><head><meta name="viewport" content="width=device-width, initial-scale=1">
<style>
:root {
  --bg:#0c0f14; --surface:#161b22; --rule:#2a2f38; --text:#e8e6e0;
  --text-mid:#b9b4a6; --text-faint:#8a847a; --gold:#c9a84c; --gold-light:#e0c472;
  --gold-faint: rgba(201,168,76,0.12);
}
body { margin:0; font-family: Georgia, serif; background:#20242b; }
#audio-player-bar {
    position: fixed; bottom: 0; left: 0; right: 0; z-index: 500;
    background: #111827; border-top: 1px solid rgba(201,168,76,0.3);
    padding: 0.55rem 1.25rem 0.65rem;
    display: flex; align-items: center; gap: 1rem;
    box-shadow: 0 -4px 24px rgba(0,0,0,0.5);
  }
  :root.light-mode #audio-player-bar { background: #e8e3d5; border-top-color: rgba(138,106,31,0.3); }
  body.audio-active { padding-bottom: 76px; }

  .audio-track-info { flex: 1; min-width: 0; }
  /* label + note share a line, wrapping together as one sentence; the queue
     label is the one line that still gets its own row, below both. */
  .audio-track-line {
    display: flex; align-items: baseline; flex-wrap: wrap;
    column-gap: 0.45rem; row-gap: 0.1rem; min-width: 0;
  }
  #audio-track-label {
    font-family: 'EB Garamond', serif; font-size: 1rem; color: var(--text);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    max-width: 100%; flex-shrink: 0;
  }
  .audio-edition-note {
    font-family: 'Cormorant Garamond', serif; font-style: italic;
    font-size: 0.72rem; line-height: 1.4; color: var(--text-faint);
    white-space: normal; min-width: 0; flex: 1 1 0%;
  }
  .audio-edition-note a { color: var(--gold); text-decoration: underline; text-underline-offset: 2px; }
  .audio-edition-toggle {
    display: none;
    font-family: 'Cinzel', serif; font-size: 0.58rem; font-style: normal;
    width: 1.1rem; height: 1.1rem; line-height: 1; vertical-align: middle;
    margin-left: 0.3rem; padding: 0;
    border: 1px solid var(--rule); border-radius: 50%;
    background: none; color: var(--text-faint); cursor: pointer;
  }
  .audio-edition-toggle:hover { border-color: var(--gold); color: var(--gold); }
  .audio-queue-label {
    display: block;
    font-family: 'Cinzel', serif; font-size: 0.52rem; letter-spacing: 0.13em;
    color: var(--gold); text-transform: uppercase; margin-top: 0.1rem;
  }
  .audio-controls { display: flex; align-items: center; gap: 0.35rem; flex-shrink: 0; }
  .audio-ctrl-btn {
    background: none; border: 1px solid rgba(201,168,76,0.28); color: var(--text-mid);
    border-radius: 3px; padding: 0.28rem 0.55rem; font-size: 0.78rem;
    cursor: pointer; transition: color 0.2s, border-color 0.2s, background 0.2s;
    white-space: nowrap; line-height: 1.3;
  }
  .audio-ctrl-btn:hover { color: var(--gold); border-color: var(--gold); }
  #audio-play-btn {
    background: var(--gold-faint); border-color: rgba(201,168,76,0.5);
    color: var(--gold); font-size: 0.9rem; padding: 0.28rem 0.9rem;
  }
  #audio-play-btn:hover { background: rgba(201,168,76,0.22); }

  .audio-scrub-row {
    display: flex; align-items: center; gap: 0.45rem; flex: 1.4; min-width: 100px;
  }
  .audio-scrub-row span {
    font-family: 'Cinzel', serif; font-size: 0.54rem;
    color: var(--text-faint); white-space: nowrap;
  }
  #audio-scrubber {
    flex: 1; -webkit-appearance: none; appearance: none;
    height: 3px; border-radius: 2px; outline: none; cursor: pointer;
    border: none; padding: 0; width: auto;
    background: rgba(255,255,255,0.15);
  }
  :root.light-mode #audio-scrubber { background: rgba(0,0,0,0.15); }
  #audio-scrubber::-webkit-slider-thumb {
    -webkit-appearance: none; width: 11px; height: 11px;
    border-radius: 50%; background: var(--gold); cursor: pointer; border: none;
  }
  #audio-scrubber::-moz-range-thumb {
    width: 11px; height: 11px; border-radius: 50%;
    background: var(--gold); cursor: pointer; border: none;
  }
  .audio-close-btn {
    background: none; border: none; color: var(--text-faint); font-size: 0.85rem;
    cursor: pointer; padding: 0.25rem 0.3rem; line-height: 1;
    transition: color 0.2s; flex-shrink: 0;
  }
  .audio-close-btn:hover { color: var(--text); }
  @media (max-width: 600px) {
    #audio-player-bar { flex-wrap: wrap; gap: 0.45rem; padding: 0.5rem 0.85rem 0.6rem; }
    .audio-scrub-row { flex: 100%; order: 10; }
    .audio-track-info { flex: 1; }
    /* same pattern as before: the sentence is too wide for one line on a
       phone, so it waits behind a small i button instead of taking a line. */
    .audio-track-info .audio-edition-note-text { display: none; }
    .audio-track-info .audio-edition-toggle { display: inline-block; }
    .audio-track-info.show-note .audio-edition-note-text { display: inline; }
    body.audio-active { padding-bottom: 110px; }
  }
body.audio-active { padding-bottom: 76px; }
</style></head><body class="audio-active">
<div style="height:300px"></div>
<div id="audio-player-bar" style="display:none;">
  <div class="audio-track-info" id="audio-track-info">
    <div class="audio-track-line">
      <span id="audio-track-label">—</span>
      <span class="audio-edition-note">&mdash; World English Bible, public domain<button class="audio-edition-toggle" onclick="toggleAudioEditionNote(this)" aria-label="About the narration">i</button><span class="audio-edition-note-text"> (the narration predates the 2020 text shown here; some wording differs)</span></span>
    </div>
    <span class="audio-queue-label" id="audio-queue-label"></span>
  </div>
  <div class="audio-controls">
    <button class="audio-ctrl-btn" title="Previous chapter" onclick="audioGoPrev()">⏮</button>
    <button class="audio-ctrl-btn" title="Rewind 10 seconds" onclick="audioRewind()">↩ 10s</button>
    <button class="audio-ctrl-btn" id="audio-play-btn" title="Play / Pause" onclick="audioTogglePlay()">▶</button>
    <button class="audio-ctrl-btn" title="Next chapter" onclick="audioGoNext()">⏭</button>
  </div>
  <div class="audio-scrub-row">
    <span id="audio-time-cur">0:00</span>
    <input type="range" id="audio-scrubber" min="0" max="100" value="0" step="0.1">
    <span id="audio-time-dur">0:00</span>
  </div>
  <button class="audio-close-btn" title="Close player" onclick="audioClose()">✕</button>
</div>


<script>document.getElementById('audio-track-label').textContent='Numbers 1';
document.getElementById('audio-queue-label').textContent='Track 1 of 3';
document.getElementById('audio-player-bar').style.display='flex';</script>
</body></html>
